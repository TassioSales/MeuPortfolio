services:
  postgres:
    image: postgres:16-alpine
    container_name: laquilaia_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-laquilaia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-laquilaia_dev_pwd}
      POSTGRES_DB: ${DB_NAME:-laquilaia_db}
      # C.UTF-8, e nÃ£o pt_BR.UTF-8: a imagem alpine usa musl, que nÃ£o traz
      # locales alÃ©m de C/C.UTF-8, e o initdb morre com "invalid locale name"
      # â€” o volume nunca Ã© inicializado, o healthcheck nunca passa e o backend
      # fica preso no depends_on. Se a ordenaÃ§Ã£o em portuguÃªs importar, troque
      # a imagem pela variante Debian e use --locale-provider=icu.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # O default precisa acompanhar o de POSTGRES_USER: a substituiÃ§Ã£o Ã© feita
      # pelo compose antes de o container existir, entÃ£o sem `.env` isto viraria
      # `pg_isready -U` e o serviÃ§o nunca ficaria saudÃ¡vel.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-laquilaia} -d ${DB_NAME:-laquilaia_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laquilaia_network

  redis:
    image: redis:7-alpine
    container_name: laquilaia_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laquilaia_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laquilaia_backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-laquilaia}:${DB_PASSWORD:-laquilaia_dev_pwd}@postgres:5432/${DB_NAME:-laquilaia_db}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5}
      # Provedor de reserva. Sem repasse, o container nÃ£o enxerga a chave e a
      # reserva fica desligada sem ninguÃ©m perceber.
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      TEMPERATURE: ${TEMPERATURE:-0.7}
      # O parecer jurídico: se roda, em que modelo, e o piso a partir do qual
      # o caso comporta o trabalho do escritório. Sem repasse, o container não
      # enxerga o .env e cai no default — o parecer rodaria no modelo do
      # atendimento e ninguém entenderia por que ficou raso.
      ANALISE_JURIDICA_ENABLED: ${ANALISE_JURIDICA_ENABLED:-true}
      ANALISE_CLAUDE_MODEL: ${ANALISE_CLAUDE_MODEL}
      ANALISE_GEMINI_MODEL: ${ANALISE_GEMINI_MODEL}
      CASO_VALOR_MINIMO: ${CASO_VALOR_MINIMO:-15000}
      MAX_TOKENS: ${MAX_TOKENS:-1024}
      LLM_MAX_CALLS_PER_MINUTE: ${LLM_MAX_CALLS_PER_MINUTE:-60}
      LLM_MAX_TOKENS_PER_MINUTE: ${LLM_MAX_TOKENS_PER_MINUTE:-40000}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-3600}
      METRICS_CACHE_TTL: ${METRICS_CACHE_TTL:-900}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution:8080}
      # Qual agente atende o WhatsApp. A Evolution nÃ£o sabe que agentes
      # existem, entÃ£o sem isto todo webhook real morre com "Missing agent_id".
      EVOLUTION_DEFAULT_AGENT_ID: ${EVOLUTION_DEFAULT_AGENT_ID}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-laquilaia}
      EVOLUTION_WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL:-http://localhost:8000/api/v1/webhook/messages}
      # Sem repassar, o container nÃ£o enxergava o valor do .env e o webhook
      # nascia recusando tudo com 503 (o endpoint exige HMAC quando DEBUG=False).
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      # As origens liberadas no CORS. Sem repasse, customizar a variÃ¡vel no
      # `.env` nÃ£o teria efeito nenhum dentro do container.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: ${DEBUG:-False}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - laquilaia_network
    # As migraÃ§Ãµes rodam antes do servidor: a aplicaÃ§Ã£o nÃ£o cria mais o
    # schema sozinha, entÃ£o subir sem `alembic upgrade` deixaria o banco vazio.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Evolution API â€” a ponte com o WhatsApp.
  #
  # Fica em profile prÃ³prio: `docker compose up` sobe a aplicaÃ§Ã£o sem ela, e
  # `docker compose --profile whatsapp up` inclui. Ela exige parear um nÃºmero
  # de verdade por QR code, entÃ£o nÃ£o deve ser obrigatÃ³ria para quem sÃ³ quer
  # ver o painel funcionando.
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: laquilaia_evolution
    profiles: ["whatsapp"]
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      # Mesmo servidor de banco, schema prÃ³prio: as tabelas da Evolution sÃ£o
      # dela e nÃ£o se misturam com as da aplicaÃ§Ã£o. O schema Ã© criado sozinho
      # na primeira subida, sem script de init â€” que sÃ³ rodaria com o volume
      # do Postgres vazio.
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${DB_USER:-laquilaia}:${DB_PASSWORD:-laquilaia_dev_pwd}@postgres:5432/${DB_NAME:-laquilaia_db}?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      # Banco 6 do Redis, para nÃ£o disputar chaves com o cache da aplicaÃ§Ã£o.
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      # O webhook global evita ter que configurar a URL a cada instÃ¢ncia
      # criada. O host Ã© `backend`, nome do serviÃ§o na rede do compose â€”
      # `localhost` aqui seria o prÃ³prio container da Evolution.
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_GLOBAL_URL: http://backend:8000/api/v1/webhook/messages
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - laquilaia_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: laquilaia_frontend
    environment:
      # URL usada pelo browser, por isso Ã© localhost e nÃ£o o host do serviÃ§o.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      # MantÃ©m o node_modules da imagem, senÃ£o o bind mount o esconde.
      - /app/node_modules
      - /app/.next
    networks:
      - laquilaia_network

volumes:
  postgres_data:
  redis_data:
  evolution_instances:

networks:
  laquilaia_network:
    driver: bridge
