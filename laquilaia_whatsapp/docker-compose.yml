services:
  postgres:
    image: postgres:16-alpine
    container_name: laquilaia_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-laquilaia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-laquilaia_dev_pwd}
      POSTGRES_DB: ${DB_NAME:-laquilaia_db}
      # C.UTF-8, e não pt_BR.UTF-8: a imagem alpine usa musl, que não traz
      # locales além de C/C.UTF-8, e o initdb morre com "invalid locale name"
      # — o volume nunca é inicializado, o healthcheck nunca passa e o backend
      # fica preso no depends_on. Se a ordenação em português importar, troque
      # a imagem pela variante Debian e use --locale-provider=icu.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # O default precisa acompanhar o de POSTGRES_USER: a substituição é feita
      # pelo compose antes de o container existir, então sem `.env` isto viraria
      # `pg_isready -U` e o serviço nunca ficaria saudável.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-laquilaia} -d ${DB_NAME:-laquilaia_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laquilaia_network

  redis:
    image: redis:7-alpine
    container_name: laquilaia_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laquilaia_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laquilaia_backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-laquilaia}:${DB_PASSWORD:-laquilaia_dev_pwd}@postgres:5432/${DB_NAME:-laquilaia_db}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5}
      # Provedor de reserva. Sem repasse, o container não enxerga a chave e a
      # reserva fica desligada sem ninguém perceber.
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      TEMPERATURE: ${TEMPERATURE:-0.7}
      MAX_TOKENS: ${MAX_TOKENS:-1024}
      LLM_MAX_CALLS_PER_MINUTE: ${LLM_MAX_CALLS_PER_MINUTE:-60}
      LLM_MAX_TOKENS_PER_MINUTE: ${LLM_MAX_TOKENS_PER_MINUTE:-40000}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-3600}
      METRICS_CACHE_TTL: ${METRICS_CACHE_TTL:-900}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution:8080}
      # Qual agente atende o WhatsApp. A Evolution não sabe que agentes
      # existem, então sem isto todo webhook real morre com "Missing agent_id".
      EVOLUTION_DEFAULT_AGENT_ID: ${EVOLUTION_DEFAULT_AGENT_ID}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-laquilaia}
      EVOLUTION_WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL:-http://localhost:8000/api/v1/webhook/messages}
      # Sem repassar, o container não enxergava o valor do .env e o webhook
      # nascia recusando tudo com 503 (o endpoint exige HMAC quando DEBUG=False).
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      # As origens liberadas no CORS. Sem repasse, customizar a variável no
      # `.env` não teria efeito nenhum dentro do container.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: ${DEBUG:-False}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - laquilaia_network
    # As migrações rodam antes do servidor: a aplicação não cria mais o
    # schema sozinha, então subir sem `alembic upgrade` deixaria o banco vazio.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Evolution API — a ponte com o WhatsApp.
  #
  # Fica em profile próprio: `docker compose up` sobe a aplicação sem ela, e
  # `docker compose --profile whatsapp up` inclui. Ela exige parear um número
  # de verdade por QR code, então não deve ser obrigatória para quem só quer
  # ver o painel funcionando.
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: laquilaia_evolution
    profiles: ["whatsapp"]
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      # Mesmo servidor de banco, schema próprio: as tabelas da Evolution são
      # dela e não se misturam com as da aplicação. O schema é criado sozinho
      # na primeira subida, sem script de init — que só rodaria com o volume
      # do Postgres vazio.
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${DB_USER:-laquilaia}:${DB_PASSWORD:-laquilaia_dev_pwd}@postgres:5432/${DB_NAME:-laquilaia_db}?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      # Banco 6 do Redis, para não disputar chaves com o cache da aplicação.
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      # O webhook global evita ter que configurar a URL a cada instância
      # criada. O host é `backend`, nome do serviço na rede do compose —
      # `localhost` aqui seria o próprio container da Evolution.
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://backend:8000/api/v1/webhook/messages
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - laquilaia_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: laquilaia_frontend
    environment:
      # URL usada pelo browser, por isso é localhost e não o host do serviço.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      # Mantém o node_modules da imagem, senão o bind mount o esconde.
      - /app/node_modules
      - /app/.next
    networks:
      - laquilaia_network

volumes:
  postgres_data:
  redis_data:
  evolution_instances:

networks:
  laquilaia_network:
    driver: bridge
