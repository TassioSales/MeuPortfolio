version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: laquilaia_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-laquilaia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-laquilaia_dev_pwd}
      POSTGRES_DB: ${DB_NAME:-laquilaia_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=pt_BR.UTF-8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $DB_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laquilaia_network

  redis:
    image: redis:7-alpine
    container_name: laquilaia_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laquilaia_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laquilaia_backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-laquilaia}:${DB_PASSWORD:-laquilaia_dev_pwd}@postgres:5432/${DB_NAME:-laquilaia_db}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution:4000}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-laquilaia}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: ${DEBUG:-False}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - laquilaia_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: laquilaia_frontend
    environment:
      # URL usada pelo browser, por isso é localhost e não o host do serviço.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      # Mantém o node_modules da imagem, senão o bind mount o esconde.
      - /app/node_modules
      - /app/.next
    networks:
      - laquilaia_network

volumes:
  postgres_data:
  redis_data:

networks:
  laquilaia_network:
    driver: bridge
